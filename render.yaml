# Render Blueprint for roundbellyspizza.com: one web service + one Postgres database.
# No "plan" lines: Render uses its default paid sizes (always on, don't sleep or expire), same as the ERP.
services:
  - type: web
    name: roundbellys-site
    runtime: python
    buildCommand: bash build.sh
    startCommand: gunicorn rbsite.wsgi:application --timeout 120 --workers 2 --threads 4
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        fromDatabase:
          name: roundbellys-site-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: OFFICE_EMAIL
        value: adam@roundbellyspizza.com

databases:
  - name: roundbellys-site-db
    databaseName: roundbellys_site
    user: roundbellys_site
