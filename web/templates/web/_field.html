<div class="field{% if f.errors %} field--error{% endif %}">
  <label class="field__label" for="{{ f.id_for_label }}">{{ f.label }}{% if not f.field.required %} <span class="opt">optional</span>{% endif %}</label>
  {{ f }}
  {% if f.help_text %}<p class="field__help">{{ f.help_text }}</p>{% endif %}
  {% for e in f.errors %}<p class="field__err">{{ e }}</p>{% endfor %}
</div>
